name: Build images and bump GitOps manifests

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "frontend/**"
      - "openshift/**"
      - ".github/workflows/guestbook-ci-cd.yml"
  workflow_dispatch:

jobs:
  build-push-and-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tag
        id: vars
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/fashinski/guestbook-backend:latest
            ghcr.io/fashinski/guestbook-backend:${{ steps.vars.outputs.TAG }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/fashinski/guestbook-frontend:latest
            ghcr.io/fashinski/guestbook-frontend:${{ steps.vars.outputs.TAG }}

      - name: Install yq
        uses: mikefarah/yq@v4.44.3
        with:
          cmd: yq --version

      - name: Bump image tags in kustomization.yaml
        env:
          TAG: ${{ steps.vars.outputs.TAG }}
        run: |
          yq -i '.images[] |= (select(.name == "ghcr.io/fashinski/guestbook-backend").newTag = strenv(TAG))' openshift/kustomization.yaml
          yq -i '.images[] |= (select(.name == "ghcr.io/fashinski/guestbook-frontend").newTag = strenv(TAG))' openshift/kustomization.yaml

      - name: Commit and push manifest bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openshift/kustomization.yaml
          git commit -m "chore(gitops): deploy ${{ steps.vars.outputs.TAG }}" || exit 0
          git push
