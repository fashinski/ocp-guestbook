apiVersion: v1
kind: Secret
metadata:
  name: eli-postgres-secret
type: Opaque
stringData:
  POSTGRESQL_USER: guestbook
  POSTGRESQL_PASSWORD: guestbookpass
  POSTGRESQL_DATABASE: guestbook
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eli-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eli-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eli-postgres
  template:
    metadata:
      labels:
        app: eli-postgres
    spec:
      containers:
        - name: postgres
          image: quay.io/fedora/postgresql-16:latest
          ports:
            - containerPort: 5432

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: eli-postgres-secret
                  key: POSTGRESQL_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eli-postgres-secret
                  key: POSTGRESQL_PASSWORD
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: eli-postgres-secret
                  key: POSTGRESQL_DATABASE
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: eli-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: eli-postgres
spec:
  type: ClusterIP
  selector:
    app: eli-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

