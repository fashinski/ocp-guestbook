apiVersion: v1
kind: Secret
metadata:
  name: eli-redis-secret
type: Opaque
stringData:
  REDIS_PASSWORD: redispass
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eli-redis-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eli-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eli-redis
  template:
    metadata:
      labels:
        app: eli-redis
    spec:
      containers:
        - name: redis
          image: quay.io/kurs/redis:latest
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eli-redis-secret
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: redis-data
              mountPath: /var/lib/redis/data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: eli-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: eli-redis
spec:
  type: ClusterIP
  selector:
    app: eli-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
