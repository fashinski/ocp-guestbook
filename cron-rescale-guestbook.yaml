---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guestbook-keeper-sa
  namespace: eli-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: guestbook-keeper-role
  namespace: eli-dev
rules:
  # allow reading and scaling deployments in this namespace
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guestbook-keeper-rb
  namespace: eli-dev
subjects:
  - kind: ServiceAccount
    name: guestbook-keeper-sa
    namespace: eli-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: guestbook-keeper-role
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: guestbook-rescaler
  namespace: eli-dev
spec:
  # run every minute (you can change this later if you want)
  schedule: "* * * * *"
  # if a run is still executing when the next minute comes,
  # don't start a second overlapping one
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: guestbook-keeper-sa
          restartPolicy: Never
          containers:
            - name: rescale
              # any kubectl image that can talk to the API server
              # this is just an example; you can swap to another kubectl image
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  echo "[$(date)] Forcing replicas to 1 for guestbook components..."

                  kubectl scale deployment backend \
                    --replicas=1 -n eli-dev || true

                  kubectl scale deployment frontend \
                    --replicas=1 -n eli-dev || true

                  kubectl scale deployment postgres \
                    --replicas=1 -n eli-dev || true

                  kubectl scale deployment redis \
                    --replicas=1 -n eli-dev || true

                  echo "Done."
              resources:
                requests:
                  cpu: "10m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
